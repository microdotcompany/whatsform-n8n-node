name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # needed to sign the npm provenance statement
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        # NPM_TOKEN is only needed until trusted publishing is set up on npmjs.com
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # versions like 0.2.0-beta.0 go to the beta tag so they don't become latest
          NPM_CONFIG_TAG: ${{ contains(github.ref_name, '-') && 'beta' || 'latest' }}
